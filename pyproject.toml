[project]
name = "infra"
version = "0.1.0"
description = "Local LLM hardware inspection, resource estimation, and vLLM runtime infrastructure"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=1.28.0",
    "openai>=3.3.1",
    "psutil>=7.2.2",
    "textual>=8.2.8",
    "torch>=2.13.0",
    "transformers>=5.15.1",
    "vllm>=0.28.0",
]

[project.scripts]
infra = "infra.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infra*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
    "B008",
]
